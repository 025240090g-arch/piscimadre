name: Build Piscimadre APK

on:
  push:
    branches:
      - main
      - codex/apk-download-button
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get Piscimadre source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build installable APK
        run: gradle --no-daemon --project-dir android assembleDebug

      - name: Save APK for run download
        uses: actions/upload-artifact@v4
        with:
          name: piscimadre-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK for the website download button
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-v1.0.0
          target_commitish: ${{ github.sha }}
          name: Piscimadre Android 1.0.0
          body: Descarga e instala la app Android de Piscimadre. Necesita internet para mostrar los datos y el mapa.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: false
